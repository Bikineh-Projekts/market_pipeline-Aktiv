name: ETL

# ---------------------------------------------------------------------
# Two schedules, deliberately different:
#
#   every 30 min, market hours  -> quotes + candles only (fast, cheap)
#   once nightly                -> adds fundamentals, earnings, indicators
#
# Alpha Vantage allows 25 requests per day in total, and four indicators
# per symbol means three symbols eat half that budget in one run. Putting
# indicators on the 30-minute schedule would exhaust the quota before
# 09:00, so they are confined to the nightly job.
#
# This job uses DATABASE_URL as-is. The pooled endpoint is the right one
# for short application runs; only migrations and maintenance need the
# direct endpoint (see the Database and Maintenance workflows).
#
# CRON IS UTC, AND THERE IS NO WAY TO MAKE IT ANYTHING ELSE. GitHub's
# `schedule:` has no time-zone field, so these numbers cannot be written in
# Berlin time -- which also means a fixed cron DRIFTS against the Berlin
# clock twice a year, by an hour, in both directions:
#
#   14:00-21:00 UTC  =  16:00-23:00 Berlin  (CEST, late Mar - late Oct)
#                    =  15:00-22:00 Berlin  (CET,  late Oct - late Mar)
#
# That drift is harmless here, because the window tracks the US trading
# session rather than the Berlin working day: New York is 14:30-21:00 UTC
# all year, since the US and the EU shift their clocks within a few weeks
# of each other. Pinning the window to Berlin instead would move it off
# the market by an hour for those few weeks.
#
# Everything the pipeline STORES and DISPLAYS is Berlin time -- see
# APP_TIMEZONE and the local_ts/local_date functions. Only the trigger
# times on this page are UTC, because GitHub gives no alternative.
# ---------------------------------------------------------------------
on:
  schedule:
    # Every 30 min across the US session.
    - cron: "0,30 14-21 * * 1-5"
    # The nightly full run: 22:30 UTC = 00:30 Berlin in summer, 23:30 in
    # winter. Note the summer case lands on the NEXT Berlin day, which is
    # why date_key is derived from the local day and not the UTC one.
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      symbols:
        description: "Symbols (blank = SYMBOLS secret)"
        required: false
        default: ""
      full:
        description: "Include fundamentals, earnings and indicators"
        type: boolean
        default: false

concurrency:
  group: etl
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      LAKEBASE_ENDPOINT: ${{ secrets.LAKEBASE_ENDPOINT }}
      SYMBOLS: ${{ secrets.SYMBOLS || 'AAPL,MSFT,GOOGL' }}
      INTRADAY_ENABLED: ${{ vars.INTRADAY_ENABLED || 'true' }}
      RUN_TRIGGER: github-actions
      STATUS_FILE: ${{ github.workspace }}/status.json

    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets exist
        run: |
          # Report every missing secret in one go. Failing on the first one
          # means fixing them is four runs of trial and error.
          MISSING=""
          for name in DATABASE_URL FINNHUB_API_KEY ALPHAVANTAGE_API_KEY TWELVEDATA_API_KEY; do
            eval "value=\$$name"
            if [ -z "$value" ]; then
              MISSING="$MISSING $name"
            else
              echo "$name: ${#value} characters"
            fi
          done

          if [ -n "$MISSING" ]; then
            echo "::error title=Missing secrets::Not set:$MISSING"
            echo ""
            echo "The pipeline has no database and/or no API keys, so it cannot run."
            echo ""
            echo "These live in GitHub, NOT in Render. Render's Environment tab and"
            echo "GitHub Actions secrets are separate stores and neither can see the"
            echo "other, so setting DATABASE_URL in Render does not help this workflow."
            echo ""
            echo "Fix: GitHub > Settings > Secrets and variables > Actions"
            echo "     > Secrets tab (not Variables) > New repository secret"
            echo "Names are case sensitive. Use the Render EXTERNAL database URL"
            echo "with ?sslmode=require appended."
            echo ""
            echo "MISSING_SECRETS=$MISSING" >> "$GITHUB_ENV"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Decide run mode
        id: mode
        run: |
          if [ "${{ inputs.full }}" = "true" ] || [ "${{ github.event.schedule }}" = "30 22 * * 1-5" ]; then
            echo "flags=--full" >> "$GITHUB_OUTPUT"
            echo "Nightly full refresh (fundamentals + earnings + indicators)"
          else
            echo "flags=" >> "$GITHUB_OUTPUT"
            echo "Quick refresh (quotes + candles)"
          fi

      - name: Run pipeline
        run: |
          ARGS="${{ steps.mode.outputs.flags }}"
          if [ -n "${{ inputs.symbols }}" ]; then
            ARGS="$ARGS --symbols ${{ inputs.symbols }}"
          fi
          python -m pipeline.run $ARGS --trigger github-actions

      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: "20"

      - name: Health check
        if: always()
        working-directory: monitor
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          STORAGE_CAP_MB: ${{ vars.STORAGE_CAP_MB || '512' }}
          DB_EXPIRES_AT: ${{ vars.DB_EXPIRES_AT }}
        run: |
          npm install --no-audit --no-fund
          node monitor.mjs --notify

      - name: Upload status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-${{ github.run_id }}
          path: status.json
          retention-days: 7
          if-no-files-found: warn

      - name: Report the failure
        if: failure()
        uses: actions/github-script@v7
        env:
          MISSING_SECRETS: ${{ env.MISSING_SECRETS }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const url = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            // Name the step that failed, so the issue says what broke rather
            // than only that something did.
            let failedSteps = [];
            try {
              const jobs = await github.rest.actions.listJobsForWorkflowRun({
                owner, repo, run_id: context.runId,
              });
              for (const job of jobs.data.jobs) {
                for (const step of job.steps || []) {
                  if (step.conclusion === "failure") failedSteps.push(step.name);
                }
              }
            } catch (e) {
              failedSteps = ["(could not read the step list)"];
            }

            const missing = (process.env.MISSING_SECRETS || "").trim();
            let cause, fix;

            if (missing) {
              cause = `Missing GitHub Actions secrets: ${missing}`;
              fix = [
                "These live in **GitHub**, not in Render. The two are separate",
                "stores and neither can see the other, so setting `DATABASE_URL`",
                "in Render's Environment tab does not reach this workflow.",
                "",
                "**Settings → Secrets and variables → Actions → Secrets tab →",
                "New repository secret**",
                "",
                "| Name | Value |",
                "| --- | --- |",
                "| `DATABASE_URL` | the Render **External** URL + `?sslmode=require` |",
                "| `FINNHUB_API_KEY` | from finnhub.io |",
                "| `ALPHAVANTAGE_API_KEY` | from alphavantage.co |",
                "| `TWELVEDATA_API_KEY` | from twelvedata.com |",
                "",
                "Names are case sensitive, and the **Secrets** tab is not the",
                "**Variables** tab. Then run *Actions → Secrets check* to confirm,",
                "and *Actions → Database → migrate*.",
              ].join("\n");
            } else {
              cause = `Failed at: ${failedSteps.join(", ") || "unknown step"}`;
              fix = [
                "Check `log_api_call` for the provider's own error message:",
                "",
                "```sql",
                "SELECT called_at_utc, endpoint, http_status, error_msg",
                "  FROM log_api_call",
                " WHERE http_status IS NULL OR http_status >= 400",
                " ORDER BY called_at_utc DESC LIMIT 20;",
                "```",
              ].join("\n");
            }

            const marker = missing ? `missing-secrets:${missing}` : `steps:${failedSteps.join(",")}`;
            const body = [
              `**${cause}**`,
              "",
              fix,
              "",
              "---",
              `Run: ${url}`,
              `Event: ${context.eventName} · ${new Date().toISOString()}`,
              `<!-- cause:${marker} -->`,
            ].join("\n");

            const open = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: "etl-failure",
            });

            if (!open.data.length) {
              await github.rest.issues.create({
                owner, repo, title: `ETL failing: ${cause}`, body,
                labels: ["etl-failure"],
              });
              return;
            }

            const issue = open.data[0];

            // The ETL runs 17x a weekday. Commenting on every failure buried
            // the useful text under 54 bare links, so: only comment when the
            // cause changed, or once every 12 hours for the same cause.
            const comments = await github.rest.issues.listComments({
              owner, repo, issue_number: issue.number, per_page: 100,
            });
            const last = comments.data[comments.data.length - 1];
            const sameCause = last && (last.body || "").includes(`<!-- cause:${marker} -->`);
            const hoursSince = last
              ? (Date.now() - new Date(last.created_at).getTime()) / 3600000
              : Infinity;

            if (sameCause && hoursSince < 12) {
              core.notice(`Same cause as ${hoursSince.toFixed(1)}h ago; not commenting again.`);
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number, body,
              });
            }

            // Keep the title current so the issue list shows the cause.
            if (issue.title !== `ETL failing: ${cause}`) {
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number,
                title: `ETL failing: ${cause}`,
              });
            }
