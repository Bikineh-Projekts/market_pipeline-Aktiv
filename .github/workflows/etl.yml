name: ETL

# ---------------------------------------------------------------------
# Two schedules, deliberately different:
#
#   every 30 min, market hours  -> quotes + candles only (fast, cheap)
#   once nightly                -> adds fundamentals, earnings, indicators
#
# Alpha Vantage allows 25 requests per day in total, and four indicators
# per symbol means three symbols eat half that budget in one run. Putting
# indicators on the 30-minute schedule would exhaust the quota before
# 09:00, so they are confined to the nightly job.
#
# This job uses DATABASE_URL as-is. The pooled endpoint is the right one
# for short application runs; only migrations and maintenance need the
# direct endpoint (see the Database and Maintenance workflows).
#
# Cron is UTC. 14:00-21:00 UTC covers the US session.
# ---------------------------------------------------------------------
on:
  schedule:
    - cron: "0,30 14-21 * * 1-5"
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      symbols:
        description: "Symbols (blank = SYMBOLS secret)"
        required: false
        default: ""
      full:
        description: "Include fundamentals, earnings and indicators"
        type: boolean
        default: false

concurrency:
  group: etl
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      SYMBOLS: ${{ secrets.SYMBOLS || 'AAPL,MSFT,GOOGL' }}
      INTRADAY_ENABLED: ${{ vars.INTRADAY_ENABLED || 'true' }}
      RUN_TRIGGER: github-actions
      STATUS_FILE: ${{ github.workspace }}/status.json

    steps:
      - uses: actions/checkout@v4

      - name: Check the secret exists
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is missing."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Decide run mode
        id: mode
        run: |
          if [ "${{ inputs.full }}" = "true" ] || [ "${{ github.event.schedule }}" = "30 22 * * 1-5" ]; then
            echo "flags=--full" >> "$GITHUB_OUTPUT"
            echo "Nightly full refresh (fundamentals + earnings + indicators)"
          else
            echo "flags=" >> "$GITHUB_OUTPUT"
            echo "Quick refresh (quotes + candles)"
          fi

      - name: Run pipeline
        run: |
          ARGS="${{ steps.mode.outputs.flags }}"
          if [ -n "${{ inputs.symbols }}" ]; then
            ARGS="$ARGS --symbols ${{ inputs.symbols }}"
          fi
          python -m pipeline.run $ARGS --trigger github-actions

      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: "20"

      - name: Health check
        if: always()
        working-directory: monitor
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          STORAGE_CAP_MB: ${{ vars.STORAGE_CAP_MB || '512' }}
        run: |
          npm install --no-audit --no-fund
          node monitor.mjs --notify

      - name: Upload status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-${{ github.run_id }}
          path: status.json
          retention-days: 7
          if-no-files-found: warn

      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Run: ${url}\nEvent: ${context.eventName}\nTime: ${new Date().toISOString()}`;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "etl-failure",
            });
            if (open.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: "ETL pipeline failure", body, labels: ["etl-failure"],
              });
            }
