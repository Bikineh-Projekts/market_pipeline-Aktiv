name: Secrets check

# ---------------------------------------------------------------------
# Throwaway diagnostic. Run it once, read the output, then delete the file.
#
# It prints the NAMES of the secrets this workflow can actually see, and
# the length of each value. It never prints a value -- GitHub masks those
# automatically, and this job only ever handles lengths.
#
# Actions -> Secrets check -> Run workflow
# ---------------------------------------------------------------------
on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Which secrets reach this workflow
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          python3 - <<'PY'
          import json, os

          data = json.loads(os.environ["SECRETS_JSON"])
          # github_token is injected automatically; it is not one of yours.
          names = sorted(k for k in data if k != "github_token")

          print("Secrets visible to this workflow:")
          if names:
              for n in names:
                  print(f"  - {n}")
          else:
              print("  (none)")
              print()
              print("  No repository secrets exist, or they were created")
              print("  somewhere this workflow cannot read them.")

          print()
          expected = [
              "DATABASE_URL",
              "FINNHUB_API_KEY",
              "ALPHAVANTAGE_API_KEY",
              "TWELVEDATA_API_KEY",
          ]
          print("What the pipeline needs:")
          for n in expected:
              print(f"  {'FOUND  ' if n in names else 'MISSING'}  {n}")

          extra = [n for n in names if n not in expected and n != "SYMBOLS"
                   and n != "DATABASE_URL_DIRECT" and n != "ALERT_WEBHOOK_URL"]
          if extra:
              print()
              print("Unrecognised names (a typo in one of these is the usual cause):")
              for n in extra:
                  print(f"  - {n}")
          PY

      - name: Length of the database secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "DATABASE_URL length: ${#DATABASE_URL}"
          if [ "${#DATABASE_URL}" -eq 0 ]; then
            echo "Empty. The secret is not reaching this workflow."
          elif [ "${#DATABASE_URL}" -lt 40 ]; then
            echo "Suspiciously short for a Neon connection string (expect ~100+)."
          else
            echo "Length looks right."
          fi

      - name: Variables, which are NOT secrets
        env:
          V_DATABASE_URL: ${{ vars.DATABASE_URL }}
        run: |
          if [ -n "$V_DATABASE_URL" ]; then
            echo "::warning::DATABASE_URL exists as a VARIABLE, not a SECRET."
            echo "Delete it from the Variables tab and recreate it under Secrets."
          else
            echo "No DATABASE_URL variable, which is correct."
          fi
