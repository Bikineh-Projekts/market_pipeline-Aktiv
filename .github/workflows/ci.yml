name: CI

# ---------------------------------------------------------------------
# Runs on every push and pull request. No secrets and no API keys: the
# suite talks to a throwaway Postgres service container and a mock
# provider on localhost, so it costs nothing and spends no API quota.
#
# This is what stops a change from quietly breaking the Power BI model.
# ---------------------------------------------------------------------
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: market_pipeline_test
        ports:
          - 5432:5432
        # Without this the first test can race the container's startup.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/market_pipeline_test

    steps:
      - uses: actions/checkout@v4

      # Read from .python-version, the same file Render reads. Testing on a
      # different interpreter than production is how a missing wheel reaches
      # a deploy: Render defaults new services to Python 3.14, which has no
      # psycopg2-binary wheel below 2.9.13, so pip compiled it from source
      # and produced a .so that failed to import.
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt -r requirements-web.txt

      - name: Run the test suite
        run: |
          # tee + a separate verdict step so failures become annotations.
          # The raw log takes several clicks to reach and is not always
          # retrievable through the API, which made a red run opaque.
          set +e
          # -rf prints the short summary of failures, which is what the
          # annotator reads. Without it pytest reports a count and no names.
          python -m pytest -v -rf --tb=short 2>&1 | tee /tmp/pytest.log
          set -e
          python tools/annotate_pytest.py /tmp/pytest.log

      - name: Environment, when the suite failed
        if: failure()
        run: |
          echo "python: $(python -V)"
          echo "pytest: $(python -m pytest --version 2>&1 | head -1)"
          python -c "import psycopg2; print('psycopg2:', psycopg2.__version__)"
          echo "--- can the test database be reached? ---"
          python - <<'PY'
          import os, psycopg2
          url = os.environ["TEST_DATABASE_URL"]
          try:
              conn = psycopg2.connect(url, connect_timeout=10)
              with conn.cursor() as cur:
                  cur.execute("SELECT version()")
                  print("connected:", cur.fetchone()[0][:60])
              conn.close()
          except Exception as exc:
              print(f"::error::cannot reach the test database: {exc}")
          PY
          echo "--- last 60 lines of the pytest log ---"
          tail -60 /tmp/pytest.log || echo "(no log was written)"

      - name: Keep the pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ github.run_id }}
          path: /tmp/pytest.log
          retention-days: 7
          if-no-files-found: warn

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Python compiles
        run: python -m compileall -q pipeline web tests tools

      - name: Workflows are valid YAML
        run: |
          pip install --quiet PyYAML
          python - <<'PY'
          import pathlib, sys, yaml

          bad = []
          workflows = sorted(pathlib.Path(".github/workflows").iterdir())

          for path in workflows:
              # GitHub only reads .yml/.yaml here. A file without the
              # extension is silently ignored and never shows up in the
              # Actions tab -- which is exactly how the secrets-check
              # workflow went missing once.
              if path.suffix not in (".yml", ".yaml"):
                  bad.append(f"{path.name}: not a .yml/.yaml file, Actions will ignore it")
                  continue
              if " " in path.name:
                  bad.append(f"{path.name}: filename contains a space")
              try:
                  spec = yaml.safe_load(path.read_text())
              except yaml.YAMLError as exc:
                  bad.append(f"{path.name}: {exc}")
                  continue
              if not spec or "jobs" not in spec:
                  bad.append(f"{path.name}: no jobs defined")

          for line in bad:
              print(f"::error::{line}")
          print(f"checked {len(workflows)} workflow file(s)")
          sys.exit(1 if bad else 0)
          PY

      - name: Monitor parses
        run: node --check monitor/monitor.mjs

      - name: Dependencies have wheels for the pinned Python
        run: python tools/check_wheels.py

      - name: Dockerfile is sane
        run: python tools/check_dockerfile.py

      - name: Render blueprint is valid YAML
        run: |
          python - <<'PY'
          import sys, yaml

          spec = yaml.safe_load(open("render.yaml"))
          services = spec.get("services") or []
          if not services:
              print("::error::render.yaml defines no services")
              sys.exit(1)

          bad = []
          for svc in services:
              name = svc.get("name", "<unnamed>")
              for field in ("type", "name", "healthCheckPath"):
                  if field not in svc:
                      bad.append(f"{name}: missing {field}")

              # A docker service is built from the Dockerfile and has no
              # build or start command; a native runtime service needs both.
              # Requiring buildCommand unconditionally is what broke this
              # check when the blueprint switched to Docker.
              runtime = svc.get("runtime", svc.get("env", ""))
              if runtime == "docker":
                  if "dockerfilePath" not in svc:
                      bad.append(f"{name}: runtime is docker but dockerfilePath is missing")
                  for field in ("buildCommand", "startCommand"):
                      if field in svc:
                          bad.append(f"{name}: {field} is ignored for a docker runtime; remove it")
              else:
                  for field in ("buildCommand", "startCommand"):
                      if field not in svc:
                          bad.append(f"{name}: missing {field}")

              # The old project pinged /healt for months and never noticed.
              if svc.get("healthCheckPath") not in (None, "/health"):
                  bad.append(f"{name}: healthCheckPath is {svc['healthCheckPath']}, expected /health")

              for env in svc.get("envVars", []):
                  if env.get("key") == "DATABASE_URL" and env.get("sync") is not False:
                      bad.append(f"{name}: DATABASE_URL must be sync: false, never a committed value")

          for line in bad:
              print(f"::error::{line}")
          if bad:
              sys.exit(1)

          for svc in services:
              print(f"render.yaml OK: {svc['name']} ({svc['type']}, "
                    f"runtime {svc.get('runtime', 'native')}), "
                    f"health at {svc.get('healthCheckPath')}")
          PY

      - name: No credentials committed
        run: python tools/check_no_credentials.py

      - name: The export guard recognises a planted credential
        run: |
          # The guard is the last thing between a leaked API key and a
          # public branch, so CI checks that it actually fires. The key is
          # planted inside a GZIPPED CSV on purpose: that is exactly where
          # a plain `grep -I` cannot see it, which is why the guard is a
          # tool and not a grep.
          mkdir -p /tmp/fake-export/csv
          printf 'log_id,error_msg\n1,"url: /q?apikey=cq3nf9pr01qhb7k2m8x4"\n' \
            | gzip > /tmp/fake-export/csv/log_api_call.csv.gz

          if python tools/check_export_safe.py /tmp/fake-export; then
            echo "::error title=Export guard is broken::It passed an export containing an API key inside a gzipped CSV, so a leak would be published."
            exit 1
          fi
          echo "The guard caught it, as it should."

          # And the other direction: a clean export must not be blocked,
          # or every export fails and the guard gets switched off.
          rm -rf /tmp/fake-export
          mkdir -p /tmp/clean-export/csv
          printf 'log_id,error_msg\n1,"rate limit exceeded"\n2,"url: /q?apikey=***"\n' \
            | gzip > /tmp/clean-export/csv/log_api_call.csv.gz
          python tools/check_export_safe.py /tmp/clean-export
          rm -rf /tmp/clean-export
