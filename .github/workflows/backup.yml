name: Backup

# ---------------------------------------------------------------------
# Why this exists: a Render free Postgres database EXPIRES 30 days after
# it is created. After a 14-day grace period Render deletes it, and the
# data goes with it. That is not a sleep or a pause -- it is deletion.
#
# This job dumps the database to a GitHub Actions artifact every week, so
# an expiry costs you a new database and a restore, not your history.
#
# Artifacts are kept for 90 days, which covers the 30-day lifetime plus
# the grace period with room to spare.
#
# Restoring is one command; see docs/RENDER.md.
# ---------------------------------------------------------------------
on:
  schedule:
    # 04:10 UTC every Sunday. An odd minute on purpose: schedules on the
    # hour are the most contended and get delayed the most.
    - cron: "10 4 * * 0"
  workflow_dispatch:
    inputs:
      schema_only:
        description: "Dump the structure only, without the rows"
        type: boolean
        default: false

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}

    steps:
      - uses: actions/checkout@v4

      # The connection string is resolved first, because the client version
      # to install depends on what the server reports.
      - name: Resolve the connection string
        run: |
          if [ -z "$DATABASE_URL" ] && [ -z "$DATABASE_URL_DIRECT" ]; then
            echo "::error title=Missing secret::DATABASE_URL is not set."
            exit 1
          fi

          # A dump is a long single session, so use the direct endpoint when
          # the configured one is pooled.
          if [ -n "$DATABASE_URL_DIRECT" ]; then
            DUMP_URL="$DATABASE_URL_DIRECT"
          else
            DUMP_URL=$(echo "$DATABASE_URL" | sed 's/-pooler\./\./')
          fi

          echo "::add-mask::$DUMP_URL"
          echo "DUMP_URL=$DUMP_URL" >> "$GITHUB_ENV"

      - name: Install a pg_dump matching the server
        run: |
          # pg_dump refuses to dump a server NEWER than itself, while psql
          # connects to it happily. Pinning a client version therefore works
          # until the host upgrades Postgres and then fails with an error
          # that never reaches the run page. So: ask the server, install that.
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt \
            $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq

          # The preinstalled psql is enough to ask the version question.
          SERVER=$(psql "$DUMP_URL" -tAc "SHOW server_version_num;" 2>/dev/null || echo "")
          if [ -z "$SERVER" ]; then
            echo "::error title=Cannot reach the database::psql could not connect, so the server version is unknown."
            exit 1
          fi

          MAJOR=$((SERVER / 10000))
          echo "Server reports PostgreSQL $MAJOR (server_version_num=$SERVER)"

          if ! sudo apt-get install -y -qq "postgresql-client-$MAJOR" 2>/dev/null; then
            echo "::warning::No postgresql-client-$MAJOR package; falling back to the newest available."
            sudo apt-get install -y -qq postgresql-client
          fi

          echo "CLIENT_BIN=/usr/lib/postgresql/$MAJOR/bin" >> "$GITHUB_ENV"
          "/usr/lib/postgresql/$MAJOR/bin/pg_dump" --version 2>/dev/null || pg_dump --version

      - name: Record what we are backing up
        run: |
          psql "$DUMP_URL" -P pager=off -c "
            SELECT current_database() AS database,
                   pg_size_pretty(pg_database_size(current_database())) AS size;"
          psql "$DUMP_URL" -P pager=off -c "
            SELECT 'dim_symbol' AS table_name, COUNT(*) FROM dim_symbol
            UNION ALL SELECT 'fact_market_quote',      COUNT(*) FROM fact_market_quote
            UNION ALL SELECT 'fact_market_timeseries', COUNT(*) FROM fact_market_timeseries
            UNION ALL SELECT 'fact_market_indicator',  COUNT(*) FROM fact_market_indicator
            UNION ALL SELECT 'log_pipeline_run',       COUNT(*) FROM log_pipeline_run
            ORDER BY 1;"

      - name: Dump
        id: dump
        run: |
          STAMP=$(date -u +%Y%m%d-%H%M)
          FILE="market_pipeline-${STAMP}.dump"

          FLAGS="--format=custom --compress=9 --no-owner --no-privileges --verbose"
          if [ "${{ inputs.schema_only }}" = "true" ]; then
            FLAGS="$FLAGS --schema-only"
            FILE="market_pipeline-schema-${STAMP}.dump"
          fi

          PGDUMP="${CLIENT_BIN:-/usr/bin}/pg_dump"
          [ -x "$PGDUMP" ] || PGDUMP=pg_dump

          # --no-owner and --no-privileges matter: the role names on a new
          # database differ, and without these the restore fails on every
          # ALTER ... OWNER TO line.
          #
          # stderr is captured so a failure becomes an annotation. Without
          # this the step reported only "exit code 1" and the reason stayed
          # in a log that cannot always be fetched.
          if ! "$PGDUMP" "$DUMP_URL" $FLAGS --file="$FILE" 2> /tmp/dump.err; then
            echo "::error title=pg_dump failed::$(tail -3 /tmp/dump.err | tr '\n' ' ' | cut -c1-400)"
            echo "--- pg_dump stderr ---"
            cat /tmp/dump.err
            exit 1
          fi

          SIZE=$(du -h "$FILE" | cut -f1)
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "::notice title=Backup written::$FILE ($SIZE)"

      - name: Verify the dump is readable
        run: |
          # A dump that cannot be listed is not a backup. pg_restore --list
          # parses the archive's table of contents without touching any
          # database, so this proves the file is intact.
          #
          # It must be the SAME client that wrote the dump: an older
          # pg_restore cannot read a newer archive format, and it fails by
          # listing nothing rather than by erroring loudly -- which read as
          # "the dump is empty" when the dump was fine.
          FILE="${{ steps.dump.outputs.file }}"
          PGRESTORE="${CLIENT_BIN:-/usr/bin}/pg_restore"
          [ -x "$PGRESTORE" ] || PGRESTORE=pg_restore
          "$PGRESTORE" --version

          if ! "$PGRESTORE" --list "$FILE" > /tmp/toc.txt 2> /tmp/toc.err; then
            echo "::error title=Cannot read the dump::$(tail -3 /tmp/toc.err | tr '\n' ' ' | cut -c1-300)"
            cat /tmp/toc.err
            exit 1
          fi

          ENTRIES=$(grep -cE '^[0-9]+;' /tmp/toc.txt || true)
          TABLES=$(grep -cE '^[0-9]+;.* TABLE ' /tmp/toc.txt || true)
          VIEWS=$(grep -cE '^[0-9]+;.* VIEW ' /tmp/toc.txt || true)

          echo "archive contains $ENTRIES objects ($TABLES tables, $VIEWS views)"

          if [ "$ENTRIES" -lt 20 ]; then
            echo "::error title=Dump looks wrong::only $ENTRIES objects; expected 11 tables, 16 views and their indexes."
            head -20 /tmp/toc.txt
            exit 1
          fi

          echo "::notice title=Dump verified::$ENTRIES objects — $TABLES tables, $VIEWS views"
          grep -E 'TABLE DATA|VIEW' /tmp/toc.txt | head -30

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: ${{ steps.dump.outputs.file }}
          retention-days: 90
          if-no-files-found: error
          compression-level: 0  # the dump is already compressed

      - name: Where to find it
        run: |
          echo "Download it from the Artifacts section of this run:"
          echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
          echo "To restore into a fresh database:"
          echo "  pg_restore --no-owner --no-privileges --clean --if-exists \\"
          echo "    --dbname \"\$NEW_DATABASE_URL\" market_pipeline-*.dump"
