name: Database

# ---------------------------------------------------------------------
# All database work, run from the GitHub UI. Nothing installed locally.
#
#   Actions -> Database -> Run workflow -> choose an action:
#
#     migrate   create tables, indexes and BI views. Safe to re-run.
#     backfill  load deep price history, then verify.
#     verify    print row counts and storage use. Changes nothing.
#     reset     drop only the bi_* views and rebuild them. Data untouched.
#
# Pooled vs direct endpoint:
# Neon's pooled endpoint (the hostname containing "-pooler") runs PgBouncer
# in transaction mode, where SET, temporary tables and SQL-level PREPARE
# are unavailable. Neon recommends a direct connection for migrations and
# admin work, so every step here uses ADMIN_URL, the direct endpoint.
# If you only set DATABASE_URL, this workflow derives the direct URL by
# stripping "-pooler" -- no second secret required.
# ---------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        required: true
        default: migrate
        options: [migrate, backfill, verify, reset]
      symbols:
        description: "Symbols for backfill"
        required: false
        default: "AAPL,MSFT,GOOGL"
      history:
        description: "Daily candles per symbol (Twelve Data allows up to 5000)"
        required: false
        default: "1000"

concurrency:
  group: database
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      STATUS_FILE: ${{ github.workspace }}/status.json

    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Resolve the admin connection string
        run: |
          # Report which secrets exist, without revealing their values.
          echo "DATABASE_URL        : ${#DATABASE_URL} characters"
          echo "DATABASE_URL_DIRECT : ${#DATABASE_URL_DIRECT} characters"

          if [ -z "$DATABASE_URL" ] && [ -z "$DATABASE_URL_DIRECT" ]; then
            echo "::error title=Missing secret::Neither DATABASE_URL nor DATABASE_URL_DIRECT is set."
            echo ""
            echo "Add it under:"
            echo "  Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "Name  : DATABASE_URL"
            echo "Value : postgresql://USER:PASSWORD@HOST/marketdb?sslmode=require"
            echo ""
            echo "Note the name is case sensitive, and an Actions *variable*"
            echo "is not the same thing as an Actions *secret*."
            exit 1
          fi

          if [ -n "$DATABASE_URL_DIRECT" ]; then
            ADMIN_URL="$DATABASE_URL_DIRECT"
            echo "Using DATABASE_URL_DIRECT."
          else
            ADMIN_URL=$(echo "$DATABASE_URL" | sed 's/-pooler\./\./')
            if [ "$ADMIN_URL" != "$DATABASE_URL" ]; then
              echo "Derived the direct endpoint from the pooled DATABASE_URL."
            else
              echo "DATABASE_URL is already a direct endpoint."
            fi
          fi

          case "$ADMIN_URL" in
            postgres://*|postgresql://*) ;;
            *)
              echo "::error title=Malformed connection string::The secret does not start with postgresql://"
              echo "Paste the whole string from Neon, including the scheme and ?sslmode=require."
              exit 1
              ;;
          esac

          echo "::add-mask::$ADMIN_URL"
          echo "ADMIN_URL=$ADMIN_URL" >> "$GITHUB_ENV"

      - name: Test the connection
        run: |
          psql "$ADMIN_URL" -tAc \
            "SELECT 'connected to ' || current_database() || ' as ' || current_user;"

      - name: Drop BI views
        if: inputs.action == 'reset'
        run: |
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE v RECORD;
          BEGIN
            FOR v IN SELECT table_name FROM information_schema.views
                      WHERE table_schema = 'public' AND table_name LIKE 'bi\_%'
            LOOP
              EXECUTE format('DROP VIEW IF EXISTS %I CASCADE', v.table_name);
            END LOOP;
          END $$;
          SQL
          echo "Views dropped. Tables and data untouched."

      - name: Apply schema and views
        if: inputs.action != 'verify'
        run: |
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f sql/01_schema.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f sql/02_bi_views.sql
          echo "Schema and BI views applied."

      - uses: actions/setup-python@v5
        if: inputs.action == 'backfill'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: inputs.action == 'backfill'
        run: pip install -r requirements.txt

      - name: Backfill history
        if: inputs.action == 'backfill'
        env:
          DATABASE_URL: ${{ env.ADMIN_URL }}
          INTRADAY_ENABLED: "false"
          INDICATOR_MAX_RECORDS: "100"
        run: |
          python -m pipeline.run \
            --symbols "${{ inputs.symbols }}" \
            --backfill ${{ inputs.history }} \
            --full \
            --trigger github-actions-backfill

      - name: Verify
        if: always() && env.ADMIN_URL != ''
        run: |
          psql "$ADMIN_URL" -P pager=off <<'SQL'
          \echo '=== row counts ==='
          SELECT 'dim_symbol' AS table_name, COUNT(*) FROM dim_symbol
          UNION ALL SELECT 'fact_market_quote',        COUNT(*) FROM fact_market_quote
          UNION ALL SELECT 'fact_market_timeseries',   COUNT(*) FROM fact_market_timeseries
          UNION ALL SELECT 'fact_market_indicator',    COUNT(*) FROM fact_market_indicator
          UNION ALL SELECT 'fact_company_fundamental', COUNT(*) FROM fact_company_fundamental
          UNION ALL SELECT 'fact_earnings_calendar',   COUNT(*) FROM fact_earnings_calendar
          UNION ALL SELECT 'log_api_call',             COUNT(*) FROM log_api_call
          UNION ALL SELECT 'log_pipeline_run',         COUNT(*) FROM log_pipeline_run
          ORDER BY 1;

          \echo '=== BI views ==='
          SELECT table_name FROM information_schema.views
           WHERE table_schema = 'public' AND table_name LIKE 'bi\_%' ORDER BY 1;

          \echo '=== storage (Neon free plan cap = 512 MB) ==='
          SELECT pg_size_pretty(pg_database_size(current_database())) AS used;

          \echo '=== last runs ==='
          SELECT started_at_utc, status, symbols_ok, symbols_failed,
                 LEFT(COALESCE(error_msg, ''), 60) AS error
            FROM log_pipeline_run ORDER BY run_id DESC LIMIT 5;

          \echo '=== recent API errors ==='
          SELECT called_at_utc, endpoint, http_status, LEFT(COALESCE(error_msg,''), 60) AS error
            FROM log_api_call
           WHERE http_status IS NULL OR http_status >= 400
           ORDER BY called_at_utc DESC LIMIT 5;
          SQL
