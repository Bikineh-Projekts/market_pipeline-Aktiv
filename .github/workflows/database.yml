name: Database

# ---------------------------------------------------------------------
# All database work, run from the GitHub UI. Nothing installed locally.
#
#   Actions -> Database -> Run workflow -> choose an action:
#
#     migrate   create tables, indexes and BI views. Safe to re-run.
#     backfill  load deep price history, then verify.
#     verify    print row counts and storage use. Changes nothing.
#     audit     20 data-quality checks: freshness, grain, orphans,
#               NULL slicer columns, derived-value arithmetic.
#               Read-only; fails the run on any FAIL.
#     dates     where every date in the database comes from: span per
#               table, candles per year, and which calendar years are
#               empty. Run this when a report shows unexpected years.
#               Read-only.
#     reset     rebuild the bi_* views from scratch. Same as migrate for
#               the views; data and tables untouched.
#
# Pooled vs direct endpoint:
# Render's external URL is a direct connection, so on Render this is a
# no-op and ADMIN_URL is simply DATABASE_URL. It matters on a provider
# that hands out a pooled hostname (Neon's contains "-pooler", and runs
# PgBouncer in transaction mode, where SET, temporary tables and SQL-level
# PREPARE are unavailable -- none of which a migration can do without).
# This workflow derives the direct URL by stripping "-pooler", so moving
# the database to such a provider needs no second secret.
# ---------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        required: true
        default: migrate
        options: [migrate, backfill, verify, audit, dates, reset]
      symbols:
        description: "Symbols for backfill"
        required: false
        default: "AAPL,MSFT,GOOGL"
      history:
        description: "Daily candles per symbol (Twelve Data allows up to 5000)"
        required: false
        default: "1000"

concurrency:
  group: database
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      LAKEBASE_ENDPOINT: ${{ secrets.LAKEBASE_ENDPOINT }}
      STATUS_FILE: ${{ github.workspace }}/status.json

    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Resolve the admin connection string
        run: |
          # Report which secrets exist, without revealing their values.
          echo "DATABASE_URL        : ${#DATABASE_URL} characters"
          echo "DATABASE_URL_DIRECT : ${#DATABASE_URL_DIRECT} characters"

          if [ -z "$DATABASE_URL" ] && [ -z "$DATABASE_URL_DIRECT" ]; then
            echo "::error title=Missing secret::Neither DATABASE_URL nor DATABASE_URL_DIRECT is set."
            echo ""
            echo "Add it under:"
            echo "  Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "Name  : DATABASE_URL"
            echo "Value : postgresql://USER:PASSWORD@HOST/marketdb?sslmode=require"
            echo ""
            echo "Note the name is case sensitive, and an Actions *variable*"
            echo "is not the same thing as an Actions *secret*."
            exit 1
          fi

          if [ -n "$DATABASE_URL_DIRECT" ]; then
            ADMIN_URL="$DATABASE_URL_DIRECT"
            echo "Using DATABASE_URL_DIRECT."
          else
            ADMIN_URL=$(echo "$DATABASE_URL" | sed 's/-pooler\./\./')
            if [ "$ADMIN_URL" != "$DATABASE_URL" ]; then
              echo "Derived the direct endpoint from the pooled DATABASE_URL."
            else
              echo "DATABASE_URL is already a direct endpoint."
            fi
          fi

          case "$ADMIN_URL" in
            postgres://*|postgresql://*) ;;
            *)
              echo "::error title=Malformed connection string::The secret does not start with postgresql://"
              echo "Paste the whole string from Neon, including the scheme and ?sslmode=require."
              exit 1
              ;;
          esac

          echo "::add-mask::$ADMIN_URL"
          echo "ADMIN_URL=$ADMIN_URL" >> "$GITHUB_ENV"

      - name: Test the connection
        run: |
          psql "$ADMIN_URL" -tAc \
            "SELECT 'connected to ' || current_database() || ' as ' || current_user;"

      # There used to be a separate "Drop BI views" step here, for `reset`
      # only. 02_bi_views.sql now drops and rebuilds the views every time
      # it runs -- CREATE OR REPLACE VIEW cannot rename a view's columns,
      # so without that, any change to a view's shape failed against a
      # database that already had the old one. That makes `reset` and
      # `migrate` do the same thing to the views, and the step redundant.
      #
      # Removing it also closed a real gap: that step CASCADEd, so `reset`
      # would silently delete a view someone had built on top of a bi_ one
      # in pgAdmin. The file's own drop refuses and names it instead.

      - name: Apply schema and views
        if: >-
          inputs.action != 'verify' && inputs.action != 'audit'
          && inputs.action != 'dates'
        run: |
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f sql/01_schema.sql
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q -f sql/02_bi_views.sql
          echo "Schema and BI views applied."

      - uses: actions/setup-python@v5
        if: inputs.action == 'backfill'
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: inputs.action == 'backfill'
        run: pip install -r requirements.txt

      - name: Backfill history
        if: inputs.action == 'backfill'
        env:
          DATABASE_URL: ${{ env.ADMIN_URL }}
          INTRADAY_ENABLED: "false"
          INDICATOR_MAX_RECORDS: "100"
        run: |
          python -m pipeline.run \
            --symbols "${{ inputs.symbols }}" \
            --backfill ${{ inputs.history }} \
            --full \
            --trigger github-actions-backfill

      - name: Audit data quality
        if: inputs.action == 'audit'
        run: |
          # Row counts say whether anything arrived. These checks say
          # whether what arrived is correct -- a NULL company_name loads
          # fine and empties every Power BI slicer, and a duplicated grain
          # silently doubles every measure.
          psql "$ADMIN_URL" -f sql/04_audit.sql | tee /tmp/audit.txt

          # Machine-readable pass for the annotations and the exit code.
          psql "$ADMIN_URL" -t -A -F'|' -f sql/04_audit.sql 2>/dev/null \
            | grep -E '^(OK|WARN|FAIL)\|' > /tmp/audit.psv || true

          FAILED=$(grep -c '^FAIL|' /tmp/audit.psv || true)
          WARNED=$(grep -c '^WARN|' /tmp/audit.psv || true)
          PASSED=$(grep -c '^OK|'   /tmp/audit.psv || true)

          while IFS='|' read -r verdict name detail; do
            case "$verdict" in
              FAIL) echo "::error title=$name::$detail" ;;
              WARN) echo "::warning title=$name::$detail" ;;
            esac
          done < /tmp/audit.psv

          {
            echo "## Data quality audit"
            echo ""
            echo "| | check | detail |"
            echo "| --- | --- | --- |"
            while IFS='|' read -r verdict name detail; do
              case "$verdict" in
                OK)   icon="✅" ;;
                WARN) icon="⚠️" ;;
                *)    icon="❌" ;;
              esac
              echo "| $icon | $name | $detail |"
            done < /tmp/audit.psv
            echo ""
            echo "**$PASSED passed · $WARNED warnings · $FAILED failures**"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$FAILED" -gt 0 ]; then
            echo "::error title=Audit failed::$FAILED check(s) failed, $WARNED warning(s)"
            exit 1
          fi
          echo "::notice title=Audit passed::$PASSED checks passed, $WARNED warning(s)"

      - name: Report where the dates come from
        if: inputs.action == 'dates'
        run: |
          # "I see 2023 dates" has two unrelated causes that need opposite
          # fixes: real backfilled history (correct, just more than
          # expected) and generated calendar rows with no facts behind them
          # (the thing that puts empty years in a Power BI slicer). This
          # report separates them instead of guessing.
          psql "$ADMIN_URL" -f sql/05_dates.sql | tee /tmp/dates.txt

          {
            echo "## Where the dates come from"
            echo ""
            echo '```'
            cat /tmp/dates.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # The two headline numbers, as annotations, so they are legible
          # on the run page without opening the log.
          SPAN=$(psql "$ADMIN_URL" -tAc "
            SELECT COALESCE(MIN(candle_time_utc)::date::text, 'none') || ' .. ' ||
                   COALESCE(MAX(candle_time_utc)::date::text, 'none')
              FROM fact_market_timeseries;")
          EMPTY=$(psql "$ADMIN_URL" -tAc "
            SELECT COUNT(*) FROM (
              SELECT d.year FROM bi_dim_date d
               LEFT JOIN (SELECT DISTINCT date_key FROM bi_fact_price_daily) f
                      ON f.date_key = d.date_key
               GROUP BY d.year HAVING COUNT(f.date_key) = 0) x;")
          echo "::notice title=Price history held::$SPAN"
          echo "::notice title=Calendar years with no price data::$EMPTY year(s) appear in date slicers with nothing behind them"

      - name: Verify
        if: always() && env.ADMIN_URL != ''
        run: |
          psql "$ADMIN_URL" -P pager=off <<'SQL'
          \echo '=== row counts ==='
          SELECT 'dim_symbol' AS table_name, COUNT(*) FROM dim_symbol
          UNION ALL SELECT 'fact_market_quote',        COUNT(*) FROM fact_market_quote
          UNION ALL SELECT 'fact_market_timeseries',   COUNT(*) FROM fact_market_timeseries
          UNION ALL SELECT 'fact_market_indicator',    COUNT(*) FROM fact_market_indicator
          UNION ALL SELECT 'fact_company_fundamental', COUNT(*) FROM fact_company_fundamental
          UNION ALL SELECT 'fact_earnings_calendar',   COUNT(*) FROM fact_earnings_calendar
          UNION ALL SELECT 'log_api_call',             COUNT(*) FROM log_api_call
          UNION ALL SELECT 'log_pipeline_run',         COUNT(*) FROM log_pipeline_run
          ORDER BY 1;

          \echo '=== BI views ==='
          SELECT table_name FROM information_schema.views
           WHERE table_schema = 'public' AND table_name LIKE 'bi\_%' ORDER BY 1;

          \echo '=== storage ==='
          SELECT pg_size_pretty(pg_database_size(current_database())) AS used;

          \echo '=== last runs ==='
          SELECT started_at_utc, status, symbols_ok, symbols_failed,
                 LEFT(COALESCE(error_msg, ''), 60) AS error
            FROM log_pipeline_run ORDER BY run_id DESC LIMIT 5;

          \echo '=== recent API errors ==='
          SELECT called_at_utc, endpoint, http_status, LEFT(COALESCE(error_msg,''), 60) AS error
            FROM log_api_call
           WHERE http_status IS NULL OR http_status >= 400
           ORDER BY called_at_utc DESC LIMIT 5;
          SQL

      - name: Summarise what is in the database
        if: always() && env.ADMIN_URL != ''
        run: |
          # The tables above go to the raw log, which takes several clicks to
          # reach and cannot always be fetched through the API at all. These
          # same numbers as a notice annotation and a job summary show up on
          # the run page itself.
          COUNTS=$(psql "$ADMIN_URL" -tAc "
            SELECT string_agg(label || '=' || n, '  ' ORDER BY label) FROM (
              SELECT 'symbols' AS label, COUNT(*) AS n FROM dim_symbol
              UNION ALL SELECT 'quotes',      COUNT(*) FROM fact_market_quote
              UNION ALL SELECT 'candles',     COUNT(*) FROM fact_market_timeseries
              UNION ALL SELECT 'indicators',  COUNT(*) FROM fact_market_indicator
              UNION ALL SELECT 'fundamentals',COUNT(*) FROM fact_company_fundamental
              UNION ALL SELECT 'earnings',    COUNT(*) FROM fact_earnings_calendar
              UNION ALL SELECT 'api_calls',   COUNT(*) FROM log_api_call
              UNION ALL SELECT 'runs',        COUNT(*) FROM log_pipeline_run
            ) x;")

          FRESH=$(psql "$ADMIN_URL" -tAc "
            SELECT COALESCE(
              'newest quote ' || ROUND(EXTRACT(EPOCH FROM (NOW() - MAX(fetched_at_utc)))/60) || ' min old',
              'no quotes yet')
            FROM fact_market_quote;")

          SIZE=$(psql "$ADMIN_URL" -tAc "SELECT pg_size_pretty(pg_database_size(current_database()));")

          # Data quality, not just row counts. A table full of rows whose
          # company_name is NULL still shows "UNKNOWN" in every Power BI
          # slicer, which is the failure this project actually had.
          QUALITY=$(psql "$ADMIN_URL" -tAc "
            SELECT 'named=' || COUNT(*) FILTER (WHERE company_name IS NOT NULL)
                || '/' || COUNT(*)
                || '  sectors=' || COUNT(*) FILTER (WHERE sector IS NOT NULL)
                || '/' || COUNT(*)
            FROM dim_symbol;")

          SAMPLE=$(psql "$ADMIN_URL" -tAc "
            SELECT string_agg(symbol_code || '=' || COALESCE(company_name,'NULL'), '  ' ORDER BY symbol_code)
            FROM dim_symbol;")

          echo "::notice title=Database contents::$COUNTS"
          echo "::notice title=Symbol profiles::$QUALITY  ·  $SAMPLE"
          echo "::notice title=Freshness::$FRESH  ·  size $SIZE"

          {
            echo "## Database contents"
            echo ""
            psql "$ADMIN_URL" -P pager=off --html -c "
              SELECT label AS \"table\", n AS rows FROM (
                SELECT 'dim_symbol' AS label, COUNT(*) AS n FROM dim_symbol
                UNION ALL SELECT 'fact_market_quote',        COUNT(*) FROM fact_market_quote
                UNION ALL SELECT 'fact_market_timeseries',   COUNT(*) FROM fact_market_timeseries
                UNION ALL SELECT 'fact_market_indicator',    COUNT(*) FROM fact_market_indicator
                UNION ALL SELECT 'fact_company_fundamental', COUNT(*) FROM fact_company_fundamental
                UNION ALL SELECT 'fact_earnings_calendar',   COUNT(*) FROM fact_earnings_calendar
                UNION ALL SELECT 'log_api_call',             COUNT(*) FROM log_api_call
                UNION ALL SELECT 'log_pipeline_run',         COUNT(*) FROM log_pipeline_run
              ) x ORDER BY label;"
            echo ""
            echo "$FRESH · database size $SIZE"
          } >> "$GITHUB_STEP_SUMMARY"
