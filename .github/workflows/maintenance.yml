name: Maintenance

# ---------------------------------------------------------------------
# Monthly cleanup so the database never reaches the storage cap.
#
# This one MUST use the direct endpoint. sql/03_maintenance.sql runs
# VACUUM, which cannot run inside a transaction block -- and Neon's pooled
# endpoint is PgBouncer in transaction mode. The workflow derives the
# direct URL from DATABASE_URL automatically, the same way the Database
# workflow does.
# ---------------------------------------------------------------------
on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

concurrency:
  group: maintenance

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}

    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Resolve the admin connection string
        run: |
          echo "DATABASE_URL        : ${#DATABASE_URL} characters"
          echo "DATABASE_URL_DIRECT : ${#DATABASE_URL_DIRECT} characters"

          if [ -z "$DATABASE_URL" ] && [ -z "$DATABASE_URL_DIRECT" ]; then
            echo "::error title=Missing secret::Neither DATABASE_URL nor DATABASE_URL_DIRECT is set."
            echo "Add DATABASE_URL under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          if [ -n "$DATABASE_URL_DIRECT" ]; then
            ADMIN_URL="$DATABASE_URL_DIRECT"
          else
            ADMIN_URL=$(echo "$DATABASE_URL" | sed 's/-pooler\./\./')
          fi

          echo "::add-mask::$ADMIN_URL"
          echo "ADMIN_URL=$ADMIN_URL" >> "$GITHUB_ENV"

      - name: Run retention and vacuum
        run: psql "$ADMIN_URL" -P pager=off -f sql/03_maintenance.sql

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Health check after cleanup
        working-directory: monitor
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STORAGE_CAP_MB: ${{ vars.STORAGE_CAP_MB || '512' }}
        run: |
          npm install --no-audit --no-fund
          node monitor.mjs
